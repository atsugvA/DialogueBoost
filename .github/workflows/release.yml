# Tag a release and this publishes it.
#
#   git tag v1.0.0.1 && git push origin v1.0.0.1
#
# Builds the zip, attaches it to a GitHub Release, and commits the regenerated manifest.json
# back to the default branch — which is the file users' Jellyfin servers poll. Everything it
# does is `scripts/build-release.sh`, so a release can be reproduced locally.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Four-part version, e.g. 1.0.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Work out the version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version must be four numbers (got '$version')"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A release that fails its own tests is not a release.
      - name: Test
        run: |
          dotnet test Jellyfin.Plugin.DialogueBoost.Tests/Jellyfin.Plugin.DialogueBoost.Tests.csproj \
            --configuration Release

      - name: Build the zip and fold it into the manifest
        run: |
          v='${{ steps.v.outputs.version }}'
          ./scripts/build-release.sh "$v" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${v}" \
            "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${v}"

      # The Release has to exist before the manifest that points at it is published, or a server
      # polling in between downloads a sourceUrl that 404s.
      - name: Publish the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v='${{ steps.v.outputs.version }}'
          gh release create "v${v}" "dist/dialogue-boost_${v}.zip" \
            --title "v${v}" --generate-notes --verify-tag || \
          gh release upload "v${v}" "dist/dialogue-boost_${v}.zip" --clobber

      - name: Commit the manifest
        run: |
          v='${{ steps.v.outputs.version }}'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json meta.json build.yaml
          git diff --staged --quiet || git commit -m "Release v${v}: manifest and version"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
